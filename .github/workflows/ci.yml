name: CI

# The nine test suites are pure Node: no dependencies, no build step, no running
# Host. `render` and `measure` read `fixtures/` when `--offline` is passed, and
# `measure` uses a headless Edge/Chrome for layout checks (reports "skip", not
# "fail", when no browser is present), so the structural checks still gate the
# build on a bare runner.
#
# The 9 gating suites:
#   smoke analyse routes actions ai style compat render measure
# (scripts/scores.mjs is a debug helper that prints scoring detail and is NOT
#  part of the gating set.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # There is nothing to install: the plugin has no dependencies and the
      # suites use only Node built-ins. This step just proves that claim.
      - name: Confirm no runtime dependencies
        shell: bash
        run: |
          node -e "
            const p = require('./package.json');
            const deps = Object.keys(p.dependencies || {});
            if (deps.length) {
              console.error('unexpected dependencies: ' + deps.join(', '));
              process.exit(1);
            }
            console.log('no runtime dependencies');
          "

      - name: Run the 9 test suites
        shell: bash
        run: |
          SUITES="smoke analyse routes actions ai style compat render measure"
          FAILED=0
          for s in $SUITES; do
            echo "=== $s ==="
            if ! node "scripts/$s.mjs" --offline; then
              echo "::error:: suite $s failed"
              FAILED=$((FAILED+1))
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::$FAILED suite(s) failed"
            exit 1
          fi
          echo "all 9 suites passed"

      - name: Verify the package packs
        shell: bash
        run: |
          npm pack --dry-run 2>&1 | tail -30

  pack:
    name: Pack tarball
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `dist/` is gitignored -- tarballs ship as Release assets, not commits.
      - name: Pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Show what went in
        run: |
          echo '--- tarball ---'
          ls -l dist/
          echo '--- contents ---'
          tar -tzf dist/*.tgz | sort

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-studio-tarball
          path: dist/*.tgz
          retention-days: 14

  # The version in package.json, the git tag, and the CHANGELOG entry are three
  # places the same number lives. This catches a mismatch on a tag push.
  version-check:
    name: Version consistency
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tag matches package.json
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: CHANGELOG has an entry for this version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[?${TAG//./\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $TAG"
            exit 1
          fi
          echo "CHANGELOG.md mentions $TAG"
